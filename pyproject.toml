[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --ignore=tests/performance"
testpaths = [
    "tests",
]
markers = [
    "performance: benchmark tests — run separately via pytest tests/performance/backend/",
]

[tool.pylint.master]
ignore = [".venv", ".pytest_cache", ".git", "__pycache__"]
