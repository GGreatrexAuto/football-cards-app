name: CI

'on':
  push:
    branches: ['main', 'accessibility_retrofit']
  pull_request:
    branches: ['main', 'accessibility_retrofit']

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: football-cards-ui/package-lock.json

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install frontend dependencies
        working-directory: football-cards-ui
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint frontend (ESLint)
        working-directory: football-cards-ui
        run: |
          npx eslint "src/**/*.{js,jsx,ts,tsx}" "tests/**/*.{js,jsx,ts,tsx}" --max-warnings=0

      - name: Check frontend formatting (Prettier)
        working-directory: football-cards-ui
        run: |
          npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}"

      - name: Check backend formatting (Black + isort)
        run: |
          black --check .
          isort --check .

      - name: Lint backend (Pylint)
        run: pylint app/ tests/ --fail-under=9.0

      - name: Lint backend (Flake8)
        run: flake8 app/ tests/

      - name: Lint YAML files
        run: yamllint .

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: football-cards-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: football-cards-ui
        run: npm ci

      - name: Build React app
        working-directory: football-cards-ui
        run: npm run build

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: football-cards-ui/build/
          retention-days: 1

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: football-cards-ui/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: football-cards-ui
        run: npm ci

      - name: Run backend unit tests
        run: pytest tests/unit/ --tb=short

      - name: Run frontend unit tests (with coverage)
        working-directory: football-cards-ui
        run: npm test -- --watchAll=false --coverage --ci

  # ── Contract & Integration Tests ────────────────────────────────────────────
  contract-integration-tests:
    name: Contract & Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Start FastAPI server
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          until curl -sf http://localhost:8000/api/v1/clubs; do sleep 1; done

      - name: Run contract tests
        run: pytest tests/contract/

      - name: Run integration tests (BDD)
        run: behave tests/integration/

  # ── E2E Tests ───────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: football-cards-ui/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: football-cards-ui
        run: npm ci

      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: football-cards-ui/build/

      - name: Install Playwright browsers
        working-directory: football-cards-ui
        run: npx playwright install --with-deps chromium webkit

      - name: Start FastAPI backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          until curl -sf http://localhost:8000/api/v1/clubs; do sleep 1; done

      - name: Start React frontend (serve build)
        working-directory: football-cards-ui
        run: |
          npx serve -s build --listen 3000 &
          until curl -sf http://localhost:3000; do sleep 1; done

      - name: Run Playwright E2E tests
        working-directory: football-cards-ui
        run: npx playwright test --project=chromium --project=webkit

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: football-cards-ui/playwright-report/
          retention-days: 7

  # ── Performance Tests ───────────────────────────────────────────────────────
  performance:
    name: Performance Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Start FastAPI server (port 8001)
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          until curl -sf http://localhost:8001/api/v1/clubs; do sleep 1; done

      - name: Run backend performance benchmarks
        run: pytest tests/performance/backend/ --benchmark-autosave
